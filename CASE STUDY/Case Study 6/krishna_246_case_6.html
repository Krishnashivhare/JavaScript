<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String Operations & Vowel Counter</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-elements">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="container">
        <header>
            <h1>Case Study <span>06</span></h1>
            <p>Advanced String Operations</p>
        </header>

        <main>
            <!-- Task 1: Reverse String -->
            <section class="card" id="reverse-card">
                <div class="card-header">
                    <div class="icon-wrapper">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"></path><path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path><path d="M3 22v-6h6"></path><path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path></svg>
                    </div>
                    <h2>Reverse String</h2>
                </div>
                <div class="card-body">
                    <div class="input-group">
                        <label for="string-input">Enter Text</label>
                        <input type="text" id="string-input" placeholder="e.g. Hello World" autocomplete="off">
                        <div class="focus-border"></div>
                    </div>
                    <button class="primary-btn" id="reverse-btn">
                        <span>Reverse Text</span>
                        <div class="btn-glow"></div>
                    </button>
                    <div class="result-area" id="reverse-result-area">
                        <p class="result-label">Result:</p>
                        <p class="result-text" id="reverse-output">Waiting for input...</p>
                    </div>
                </div>
            </section>

            <!-- Task 2: Vowel Counter -->
            <section class="card" id="vowel-card">
                <div class="card-header">
                    <div class="icon-wrapper">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"></path><path d="M8 7h6"></path><path d="M8 11h8"></path></svg>
                    </div>
                    <h2>Vowel Counter</h2>
                </div>
                <div class="card-body">
                    <div class="input-group">
                        <label for="paragraph-input">Enter Paragraph</label>
                        <textarea id="paragraph-input" placeholder="Type or paste your paragraph here..." rows="4"></textarea>
                        <div class="focus-border"></div>
                    </div>
                    <button class="primary-btn" id="count-btn">
                        <span>Count Vowels</span>
                        <div class="btn-glow"></div>
                    </button>
                    <div class="result-area" id="vowel-result-area">
                        <div class="vowel-stats">
                            <div class="stat-box main-stat">
                                <span class="stat-value" id="total-vowels">0</span>
                                <span class="stat-label">Total Vowels</span>
                            </div>
                            <div class="vowel-breakdown">
                                <div class="mini-stat">A: <span id="count-a">0</span></div>
                                <div class="mini-stat">E: <span id="count-e">0</span></div>
                                <div class="mini-stat">I: <span id="count-i">0</span></div>
                                <div class="mini-stat">O: <span id="count-o">0</span></div>
                                <div class="mini-stat">U: <span id="count-u">0</span></div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
